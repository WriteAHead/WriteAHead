name: Update Codeforces Rating Graph
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  cf-rating-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests matplotlib
      - name: Generate rating graph
        run: python scripts/cf_rating_graph.py
      - name: Commit graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add codeforces-rating.svg
          git diff --staged --quiet || git commit -m "chore: update codeforces rating graph"
          git push
